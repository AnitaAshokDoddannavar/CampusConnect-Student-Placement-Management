spring.application.name=CampusConnect

spring.datasource.url=jdbc:mysql://localhost:3307/campusconnect
spring.datasource.username=root
spring.datasource.password=root

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

#Actuator
management.endpoints.web.exposure.include=health,info,metrics
info.app.name=CampusConnect
info.app.description=Student Placement Management System
info.app.version=1.0.0

#Connection pool using Hkari CP
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.pool-name=CampusConnectHikariPool


#Profile
spring.profiles.active=dev

#File Upload and Download
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
